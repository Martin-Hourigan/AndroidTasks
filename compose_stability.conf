// Classes Compose should treat as stable.
//
// Without this every screen recomposes on every state change, however unrelated.
// Compose infers stability from field types, and two things here defeat it: the
// model classes hold List/Set/Map, whose interfaces could in principle be
// mutable implementations, and they hold java.time values, which are external
// classes it cannot see into. Both are in fact deeply immutable — every field is
// a val and no collection is ever mutated after construction — so telling the
// compiler so is accurate, not a shortcut.

java.time.*
dev.mahourigan.tasks.domain.*
dev.mahourigan.tasks.data.*
